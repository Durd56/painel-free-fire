<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Gamer</title>
<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
}
header{
  padding:15px;
  text-align:center;
  box-shadow:0 0 20px red;
}
.cards{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
}
.card{
  background:#120000;
  padding:20px;
  width:160px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 15px red;
}
.logout{
  display:block;
  margin:40px auto;
  padding:10px 30px;
  background:red;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("logado")!=="sim"){
  location.href="index.html";
}
</script>

<header>
<h1>🔥 PAINEL FREE FIRE 🔥</h1>
</header>

<div class="cards">
  <div class="card">🎯 Sensibilidade</div>
  <div class="card">⚙️ Config</div>
  <div class="card">📊 Status</div>
</div>

<button class="logout" onclick="sair()">SAIR</button>

<script>
function sair(){
  localStorage.removeItem("logado");
  location.href="index.html";
}
</script>

</body>
</html>
