<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Free Fire</title>
<style>
  /* ===== BODY ===== */
  body {
    background: #000;
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* ===== BOX PRINCIPAL ===== */
  .box {
    background: #111;
    border: 2px solid red;
    box-shadow: 0 0 25px red;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 300px;
    box-sizing: border-box;
  }

  /* ===== TÍTULO ===== */
  h2 {
    color: red;
    margin-bottom: 20px;
  }

  /* ===== BOTÕES ===== */
  button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover {
    transform: scale(1.05);
  }

  .on {
    background: #00ff00;
    box-shadow: 0 0 15px #00ff00;
  }

  .off {
    background: #ff0000;
    box-shadow: 0 0 15px #ff0000;
  }

  /* ===== STATUS ===== */
  #status {
    margin-top: 15px;
    color: white;
    font-size: 16px;
    font-weight: bold;
  }

  /* ===== RESPONSIVO ===== */
  @media (max-width: 400px) {
    .box {
      padding: 20px;
    }

    button {
      font-size: 16px;
      padding: 12px;
    }
  }
</style>
</head>
<body>

  <div class="box">
    <h2>🔥 PAINEL FF 🔥</h2>

    <button class="on" onclick="ativar()">AIM ON</button>
    <button class="off" onclick="desativar()">AIM OFF</button>

    <p id="status">Status: DESLIGADO</p>
  </div>

  <script>
    function ativar() {
      document.getElementById("status").innerText = "Status: ATIVADO";
    }

    function desativar() {
      document.getElementById("status").innerText = "Status: DESLIGADO";
    }
  </script>
</body>
</html>
