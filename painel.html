<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Free Fire</title>

  <style>
    body {
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #111;
      border: 2px solid red;
      box-shadow: 0 0 25px red;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 280px;
    }

    h2 {
      color: red;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .on {
      background: #00ff00;
      box-shadow: 0 0 15px #00ff00;
    }

    .off {
      background: #ff0000;
      box-shadow: 0 0 15px #ff0000;
    }

    #status {
      margin-top: 15px;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>🔥 PAINEL FF 🔥</h2>

    <button class="on" onclick="ativar()">AIM ON</button>
    <button class="off" onclick="desativar()">AIM OFF</button>

    <p id="status">Status: DESLIGADO</p>
  </div>

  <script>
    function ativar() {
      document.getElementById("status").innerText = "Status: ATIVADO";
    }

    function desativar() {
      document.getElementById("status").innerText = "Status: DESLIGADO";
    }
  </script>

</body>
</html>
