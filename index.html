<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login Gamer</title>
  <style>
    /* ===== BODY ===== */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #0a0000, #000);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ===== CENTRALIZAÇÃO ===== */
    .page-center {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* ===== LOGIN BOX ===== */
    .login-box {
      background: #120000;
      padding: 30px;
      width: 300px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px red;
    }

    .login-box h2 {
      color: red;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid red;
      border-radius: 6px;
      background: #000;
      color: white;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box .msg {
      color: #ff5555;
      margin-top: 10px;
    }

    /* ===== PAINEL ===== */
    .painel {
      margin-top: 50px;
      text-align: center;
    }

    .btn {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      color: white;
    }

    .on {
      background: #00ff00;
      box-shadow: 0 0 15px #00ff00;
    }

    .off {
      background: #ff0000;
      box-shadow: 0 0 15px #ff0000;
    }

    #status {
      color: white;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="page-center">
    <!-- ===== LOGIN ===== -->
    <div class="login-box" id="login-box">
      <h2>🔥 PAINEL FREE FIRE 🔥</h2>
      <input id="user" placeholder="Usuário">
      <input id="pass" type="password" placeholder="Senha">
      <button onclick="login()">ENTRAR</button>
      <p class="msg" id="msg"></p>
    </div>

    <!-- ===== PAINEL ===== -->
    <div class="painel" id="painel" style="display:none;">
      <button class="btn on" onclick="ativar()">AIM ON</button>
      <button class="btn off" onclick="desativar()">AIM OFF</button>
      <p id="status">Status: DESLIGADO</p>
    </div>
  </div>

  <script>
    /* ===== LOGIN ===== */
    const USUARIO = "eduoliveer";
    const SENHA = "956774740@Ab";

    function login() {
      const userInput = document.getElementById("user").value;
      const passInput = document.getElementById("pass").value;
      const msg = document.getElementById("msg");
      const loginBox = document.getElementById("login-box");
      const painel = document.getElementById("painel");

      if(userInput === USUARIO && passInput === SENHA) {
        localStorage.setItem("logado", "sim");
        // Mostrar painel e esconder login
        loginBox.style.display = "none";
        painel.style.display = "block";
      } else {
        msg.innerText = "Usuário ou senha incorretos";
      }
    }

    /* ===== PAINEL ===== */
    function ativar() {
      document.getElementById("status").innerText = "Status: ATIVADO";
    }

    function desativar() {
      document.getElementById("status").innerText = "Status: DESLIGADO";
    }

    /* ===== MANTER LOGIN ===== */
    window.onload = function() {
      if(localStorage.getItem("logado") === "sim") {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("painel").style.display = "block";
      }
    }
  </script>
</body>
</html>
