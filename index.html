<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aim Trainer FF + Presets</title>
<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== PAINEL ===== */
.painel{
  margin-top:20px;
  background:#111;
  border:2px solid red;
  box-shadow:0 0 20px red;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:360px;
  text-align:center;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.rush{background:#ff0000;color:#fff;}
.capa{background:#00ff00;color:#000;}
.sniper{background:#00aaff;color:#fff;}

.info{
  margin-top:10px;
  font-size:14px;
}

/* ===== AIM TRAINER ===== */
#arena{
  margin-top:20px;
  width:90%;
  max-width:360px;
  height:360px;
  border:2px solid #fff;
  position:relative;
  overflow:hidden;
}

#alvo{
  width:50px;
  height:50px;
  background:red;
  border-radius:50%;
  position:absolute;
  display:none;
  box-shadow:0 0 15px red;
}
</style>
</head>
<body>

<h2>🔥 AIM TRAINER FF 🔥</h2>

<div class="painel">
  <button class="rush" onclick="presetRush()">🎯 Preset Rush</button>
  <button class="capa" onclick="presetCapa()">💥 Preset Capa</button>
  <button class="sniper" onclick="presetSniper()">🔵 Preset Sniper</button>
  <div class="info" id="presetInfo">Nenhum preset ativo</div>
</div>

<div class="painel">
  <button onclick="startTrainer()">▶️ Iniciar Aim Trainer</button>
  <div class="info">
    Pontos: <span id="score">0</span> |
    Tempo: <span id="time">0</span>s
  </div>
</div>

<div id="arena">
  <div id="alvo"></div>
</div>

<script>
let score = 0;
let time = 0;
let timer;
let velocidade = 1200;

/* ===== PRESETS ===== */
function presetRush(){
  velocidade = 700;
  localStorage.setItem("preset","Rush");
  presetInfo.innerText = "Preset Rush ativo (rápido)";
}

function presetCapa(){
  velocidade = 900;
  localStorage.setItem("preset","Capa");
  presetInfo.innerText = "Preset Capa ativo (equilibrado)";
}

function presetSniper(){
  velocidade = 1300;
  localStorage.setItem("preset","Sniper");
  presetInfo.innerText = "Preset Sniper ativo (precisão)";
}

/* ===== AIM TRAINER ===== */
function startTrainer(){
  score = 0;
  time = 0;
  scoreEl.innerText = 0;
  timeEl.innerText = 0;

  clearInterval(timer);
  timer = setInterval(()=>{
    time++;
    timeEl.innerText = time;
    spawnAlvo();
  }, velocidade);
}

function spawnAlvo(){
  const arena = document.getElementById("arena");
  const alvo = document.getElementById("alvo");

  const x = Math.random() * (arena.clientWidth - 50);
  const y = Math.random() * (arena.clientHeight - 50);

  alvo.style.left = x + "px";
  alvo.style.top = y + "px";
  alvo.style.display = "block";
}

document.getElementById("alvo").onclick = ()=>{
  score++;
  scoreEl.innerText = score;
  alvo.style.display = "none";
};

/* ===== ELEMENTOS ===== */
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const presetInfo = document.getElementById("presetInfo");

/* ===== CARREGAR PRESET ===== */
window.onload = ()=>{
  const p = localStorage.getItem("preset");
  if(p){
    presetInfo.innerText = "Preset ativo: " + p;
  }
}
</script>

</body>
</html>
